<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد الشخصي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="brand">
            <span class="logo"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="8" width="24" height="17" rx="5" fill="#4f8cff"/><circle cx="11" cy="16" r="2.4" fill="#0f1420"/><circle cx="19" cy="16" r="2.4" fill="#0f1420"/><rect x="12" y="2" width="6" height="4" rx="2" fill="#4f8cff"/><rect x="10" y="21" width="10" height="2" rx="1" fill="#0f1420"/></svg></span>
            <div>
                <h1 id="uiTitle">المساعد الشخصي</h1>
                <span class="subtitle" id="uiSubtitle">شغال محليًا على جهازك</span>
            </div>
        </div>
        <div class="topbar-side">
            <select id="langSelect" title="Language / اللغة / Dil">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="tr">Türkçe</option>
            </select>
            <span id="modeBadge" class="badge">...</span>
        </div>
    </header>

    <div class="layout">
        <main class="chat-panel">
            <div id="messages" class="messages">
                <div class="msg assistant">
                    <div class="bubble" id="welcomeBubble"></div>
                </div>
            </div>

            <div class="quick-prompts">
                <button class="chip" id="chip1"></button>
                <button class="chip" id="chip2"></button>
                <button class="chip" id="chip3"></button>
            </div>

            <form id="composer" class="composer">
                <input id="input" type="text" maxlength="4000" autocomplete="off">
                <button id="sendBtn" type="submit">➤</button>
            </form>
        </main>

        <aside class="sidebar">
            <section class="card">
                <h2><span id="tasksTitle"></span> <button id="refreshState" class="mini-btn">↻</button></h2>
                <ul id="taskList" class="task-list"></ul>
            </section>
            <section class="card">
                <h2 id="filesTitle"></h2>
                <ul id="fileList" class="file-list"></ul>
            </section>
            <section class="card">
                <h2 id="notesTitle"></h2>
                <pre id="notesView" class="notes-view"></pre>
            </section>
        </aside>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
